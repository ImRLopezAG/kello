name: Publish alpha

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-alpha
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Require successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_commit="$(git rev-parse HEAD)"
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$release_commit" --branch main --event push --limit 1 --json status,conclusion --jq '.[0] | .status == "completed" and .conclusion == "success"')"
          if [ "$passed" != true ]; then
            echo '::error::Publishing requires successful main push CI for this exact commit.'
            exit 1
          fi
      - name: Require a reviewed alpha version and package identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('apps/kello/package.json', 'utf8'));
          assert.equal(pkg.name, 'kello');
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`, 'Release tag must match the package version');
          }
          assert.match(pkg.version, /^\d+\.\d+\.\d+-alpha\.\d+$/);
          assert.equal(pkg.license, 'MIT');
          assert.equal(pkg.repository.url, `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`);
          assert.equal(pkg.publishConfig.tag, 'alpha');
          assert.equal(pkg.publishConfig.access, 'public');
          assert.equal(readFileSync('LICENSE', 'utf8'), readFileSync('apps/kello/LICENSE', 'utf8'));
          JS
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run --cwd apps/kello build
      - name: Update npm for trusted publishing
        run: npm install --global npm@11
      - name: Publish using npm trusted publishing
        working-directory: apps/kello
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: npm publish --ignore-scripts --access public --tag alpha
