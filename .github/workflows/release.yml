name: Publish alpha

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-alpha
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require successful main CI for this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_commit="$(git rev-parse HEAD)"
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$release_commit" --branch main --event push --limit 1 --json databaseId,status,conclusion --jq '.[0] | select(.status == "completed" and .conclusion == "success") | .databaseId')"
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo '::error::Publishing requires successful main push CI for this exact commit.'
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
      - name: Require a reviewed alpha version and package identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('apps/kello/package.json', 'utf8'));
          assert.equal(pkg.name, 'kello');
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`, 'Release tag must match the package version');
          }
          assert.match(pkg.version, /^\d+\.\d+\.\d+-alpha\.\d+$/);
          assert.equal(pkg.license, 'MIT');
          assert.equal(pkg.repository.url, `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`);
          assert.equal(pkg.publishConfig.tag, 'alpha');
          assert.equal(pkg.publishConfig.access, 'public');
          assert.equal(readFileSync('LICENSE', 'utf8'), readFileSync('apps/kello/LICENSE', 'utf8'));
          const cli = JSON.parse(readFileSync('apps/kello-cli/package.json', 'utf8'));
          assert.equal(cli.name, 'kello-cli');
          assert.equal(cli.version, pkg.version);
          assert.equal(cli.license, pkg.license);
          assert.equal(cli.repository.url, pkg.repository.url);
          assert.equal(cli.publishConfig.tag, 'alpha');
          assert.equal(cli.publishConfig.access, 'public');
          assert.equal(readFileSync('LICENSE', 'utf8'), readFileSync('apps/kello-cli/LICENSE', 'utf8'));
          JS
      - name: Download verified CI package
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name kello-package --dir "$RUNNER_TEMP/kello-release"
      - name: Verify CI package artifact
        env:
          RELEASE_COMMIT: ${{ steps.ci.outputs.commit }}
          ARTIFACT_DIR: ${{ runner.temp }}/kello-release
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const dir = process.env.ARTIFACT_DIR;
          for (const name of ['kello', 'kello-cli']) {
            const pkg = JSON.parse(readFileSync(`apps/${name}/package.json`, 'utf8'));
            const file = name === 'kello' ? 'manifest.json' : 'cli-manifest.json';
            const manifest = JSON.parse(readFileSync(`${dir}/${file}`, 'utf8'));
            assert.equal(manifest.commit, process.env.RELEASE_COMMIT, 'CI artifact commit mismatch');
            assert.equal(manifest.name, pkg.name, 'CI artifact package mismatch');
            assert.equal(manifest.version, pkg.version, 'CI artifact version mismatch');
            const sha256 = createHash('sha256').update(readFileSync(`${dir}/${name}.tgz`)).digest('hex');
            assert.equal(manifest.sha256, sha256, 'CI tarball checksum mismatch');
          }
          JS
      - name: Update npm for trusted publishing
        run: npm install --global npm@11
      - name: Check CLI bootstrap artifact
        id: cli
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/kello-release
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const {version} = JSON.parse(readFileSync('apps/kello-cli/package.json', 'utf8'));
          const registry = 'https://registry.npmjs.org';
          const get = (url) => fetch(url, {signal: AbortSignal.timeout(10000)});
          const response = await get(`${registry}/kello-cli/${encodeURIComponent(version)}`);
          let published = false;
          if (response.status !== 404) {
            assert(response.ok, 'CLI registry lookup failed');
            const metadata = await response.json();
            assert.equal(metadata.name, 'kello-cli');
            assert.equal(metadata.version, version);
            const local = readFileSync(`${process.env.ARTIFACT_DIR}/kello-cli.tgz`);
            assert.equal(metadata.dist.integrity, `sha512-${createHash('sha512').update(local).digest('base64')}`);
            const archive = await get(`${registry}/kello-cli/-/kello-cli-${encodeURIComponent(version)}.tgz`);
            assert(archive.ok, 'CLI archive lookup failed');
            assert(local.equals(Buffer.from(await archive.arrayBuffer())), 'CLI bootstrap differs from verified CI artifact');
            const tags = await get(`${registry}/-/package/kello-cli/dist-tags`);
            assert(tags.ok, 'CLI tags lookup failed');
            assert.equal((await tags.json()).alpha, version);
            published = true;
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`);
          JS
      - name: Publish using npm trusted publishing
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: npm publish "$RUNNER_TEMP/kello-release/kello.tgz" --ignore-scripts --access public --tag alpha
      - name: Publish verified CLI artifact with OIDC
        if: steps.cli.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: npm publish "$RUNNER_TEMP/kello-release/kello-cli.tgz" --ignore-scripts --access public --tag alpha
