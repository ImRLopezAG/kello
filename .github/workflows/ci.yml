name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: loom-ci-only
          POSTGRES_DB: kello_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kello_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LOOM_TEST_DATABASE_URL: postgresql://postgres:loom-ci-only@127.0.0.1:55432/kello_test
      LOOM_TEST_POOLED_DATABASE_URL: postgresql://postgres:loom-ci-only@127.0.0.1:56432/kello_test
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Prepare native integration dependencies
        run: |
          node -p '"KELLO_NODE24_EXECUTABLE=" + process.execPath' >> "$GITHUB_ENV"
          docker pull otel/opentelemetry-collector@sha256:0beba82d63792511591522a8d582904b9a8ae81710357bfcab731607b8b0ffe2
          sudo apt-get update
          sudo apt-get install -y pgbouncer
          mkdir -m 700 "$RUNNER_TEMP/kello-pgbouncer"
          cat > "$RUNNER_TEMP/kello-pgbouncer/users.txt" <<'EOF'
          "postgres" "loom-ci-only"
          EOF
          cat > "$RUNNER_TEMP/kello-pgbouncer/pgbouncer.ini" <<EOF
          [databases]
          kello_test = host=127.0.0.1 port=55432 dbname=kello_test
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 56432
          unix_socket_dir = $RUNNER_TEMP/kello-pgbouncer
          auth_type = scram-sha-256
          auth_file = $RUNNER_TEMP/kello-pgbouncer/users.txt
          auth_user = postgres
          auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = \$1
          pool_mode = transaction
          default_pool_size = 20
          max_client_conn = 100
          ignore_startup_parameters = options,statement_timeout,lock_timeout
          logfile = $RUNNER_TEMP/kello-pgbouncer/pgbouncer.log
          pidfile = $RUNNER_TEMP/kello-pgbouncer/pgbouncer.pid
          EOF
          chmod 600 "$RUNNER_TEMP/kello-pgbouncer/"*
          pgbouncer -d "$RUNNER_TEMP/kello-pgbouncer/pgbouncer.ini"
          PGPASSWORD=loom-ci-only psql -h 127.0.0.1 -p 56432 -U postgres -d kello_test -c 'SELECT 1'
      - name: Build, typecheck, unit tests, formatting and Oxlint
        env:
          VITEST_MAX_WORKERS: "2"
        run: bun run check --env-mode=loose --concurrency=1
      - name: Restore build outputs from the local Turbo cache
        run: |
          backup=$(mktemp -d)
          for path in apps/docs/dist apps/docs/.astro apps/kello/dist packages/examples/tasks/dist packages/examples/tasks/kello/_generated packages/examples/tasks/.loom/generations packages/examples/jobs-storage/dist packages/examples/jobs-storage/kello/_generated packages/examples/jobs-storage/.loom/generations; do
            mv "$path" "$backup/${path//\//_}"
          done
          bun run build
          test -f apps/kello/dist/core/server/index.js
          test -f apps/kello/dist/tooling/index.js
          bun apps/kello/cli.js --help > /dev/null
          test -f apps/docs/dist/index.html
          test -f packages/examples/tasks/dist/index.html
          test -f packages/examples/jobs-storage/dist/index.html
          git diff --exit-code -- 'packages/examples/*/kello/migrations'
      - name: PostgreSQL integration and packed Bun/Node consumers
        run: bun run test:integration
      - name: Install Chromium
        working-directory: packages/e2e
        run: bunx --no-install playwright install --with-deps chromium
      - name: Browser and copied packed example
        run: bun run test:browser
      - name: Report provider scope
        run: echo 'Local PostgreSQL, package and browser checks only. Neon acceptance runs separately.' >> "$GITHUB_STEP_SUMMARY"
